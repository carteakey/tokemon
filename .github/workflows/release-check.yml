name: Release check

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Candidate commit SHA to check (defaults to the dispatch ref HEAD)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Keep CI on the patched toolchain required by go.mod and Docker.
          go-version: '1.26.10'
          cache: true

      - name: Pre-tag release gates (browser smoke, image identity, trivy, race suite)
        run: bash deploy/release-check.sh "${{ inputs.candidate_sha || github.sha }}"
