services:
  tokemon:
    build:
      context: ..
      args:
        TOKEMON_VERSION: ${TOKEMON_VERSION:-dev}
        TOKEMON_COMMIT: ${TOKEMON_COMMIT:-unknown}
        TOKEMON_BUILD_DATE: ${TOKEMON_BUILD_DATE:-unknown}
    command: ["serve", "--database", "/data/tokemon.db", "--catalog", "/config/models.yaml"]
    user: "${TOKEMON_UID:-65532}:${TOKEMON_GID:-65532}"
    ports:
      # Keep the dashboard local by default. Set TOKEMON_BIND_ADDRESS to a
      # private-network address only when remote agents need to reach the hub.
      - "${TOKEMON_BIND_ADDRESS:-127.0.0.1}:${TOKEMON_PORT:-18787}:8080"
    volumes:
      - ../data:/data
      - ../catalog/models.yaml:/config/models.yaml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      TOKEMON_INGEST_TOKEN: ${TOKEMON_INGEST_TOKEN:?Set TOKEMON_INGEST_TOKEN before deploying}
      TOKEMON_ANALYTICS_TIMEZONE: ${TOKEMON_ANALYTICS_TIMEZONE:-UTC}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
