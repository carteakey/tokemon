{{define "login"}}<!doctype html>
<html lang="en">
<head>
  {{template "head" .}}
  <style>
    body { min-height:100vh; display:grid; place-items:center; padding:20px; }
    .login-card { width:min(360px,100%); padding:26px 24px; border:1px solid var(--line-bright); border-radius:12px; background:var(--surface); }
    .brand-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; } .login-card .brand-mark { width:30px; height:30px; image-rendering:pixelated; } .login-card .brand-name { font:700 15px/1 var(--font-display); letter-spacing:.08em; color:var(--text); }
    .login-lead { margin:0 0 18px; color:var(--muted); font-size:13px; }
    .login-card label { display:grid; gap:6px; margin-top:12px; color:var(--faint); font:700 10px/1 var(--font-data); letter-spacing:.1em; text-transform:uppercase; }
    .login-card input { width:100%; padding:10px 11px; border:1px solid var(--control-border); border-radius:4px; background:#11130f; color:var(--text); font:13px var(--font-data); }
    .login-card input:focus-visible { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:2px; }
    .login-card button { width:100%; margin-top:16px; min-height:40px; border:1px solid var(--accent); border-radius:5px; background:transparent; color:var(--accent); font:700 11px/1 var(--font-data); letter-spacing:.07em; text-transform:uppercase; cursor:pointer; }
    .login-card button:hover,.login-card button:focus-visible { background:rgba(155,187,160,.12); outline:2px solid var(--accent); outline-offset:2px; }
    .login-error { margin:0 0 4px; padding:9px 11px; border:1px solid var(--warm); border-radius:5px; color:var(--warm); font:12px/1.4 var(--font-data); }
    .login-note { margin:16px 0 0; color:var(--faint); font-size:10px; }
  </style>
</head>
<body><a class="skip-link" href="#main-content">Skip to content</a><main id="main-content" class="login-card">
  <div class="brand-row"><img class="brand-mark" src="{{staticURL "/static/tokemon/token-dex.png"}}" alt="" width="30" height="30"><span class="brand-name">TOKEMON</span></div>
  <h1 class="sr-only">Sign in</h1>
  <p class="login-lead">Sign in to the usage dashboard.</p>
  {{if .Error}}<p class="login-error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="login-username">Username</label>
    <input id="login-username" name="username" type="text" autocomplete="username" required>
    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="login-note">Local-first · metadata only · no conversation content</p>
</main></body></html>{{end}}
